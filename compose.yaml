name: ros2

services:
  ros2:
    build: .
    # prebuilt image; `rosdev rebuild` builds it locally, local/Dockerfile (if present) extends it
    image: ${ROS2_DEV_IMAGE:-ghcr.io/davidseysergit/ros2-dev:${ROS2_DEV_TAG:-latest}}
    container_name: ros2
    hostname: ros2
    ports:
      - "127.0.0.1:6080:6080"   # browser desktop, localhost only (VNC has no password)
    environment:
      - RESOLUTION=${RESOLUTION:-1920x1080}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ${ROS2_WS:-./ws}:/home/ros/ws   # your colcon workspace (ROS2_WS in .env), edited from the Mac
    shm_size: 2gb
    restart: unless-stopped
