[program:foxglove]
# Allow the package:// assets supplied by ROS and file:// mesh assets from the
# mounted workspace. The latter is used by several URDFs generated in ~/ws.
command=/bin/bash -lc "exec ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765 address:=0.0.0.0 asset_uri_allowlist:=\"['^package://.*$','^file:///home/ros/ws/.*$']\""
priority=50
autorestart=true
